[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitch-dodge"
dynamic = ["version"]
description = "Dodge projectiles fired by the melody of any song."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.5",
    "librosa>=0.10",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "soundfile>=0.12", "pillow>=10"]

[project.scripts]
pitch-dodge = "pitch_dodge.cli:main"

[tool.setuptools.packages.find]
include = ["pitch_dodge*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.js", "*.css", "*.mp3", "*.wav", "*.ogg", "*.flac"]

[tool.setuptools.dynamic]
version = { attr = "pitch_dodge.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:no fast renderer available"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
